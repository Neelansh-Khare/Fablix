apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fabflix-db-replica
spec:
  serviceName: "db-replica"
  replicas: 1
  selector:
    matchLabels:
      app: fabflix-db
      role: replica
  template:
    metadata:
      labels:
        app: fabflix-db
        role: replica
    spec:
      initContainers:
      - name: init-replica
        image: postgres:15-alpine
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: fabflix-secrets
              key: db-password
        command:
        - /bin/sh
        - -c
        - |
          until pg_isready -h db-primary -p 5432 -U postgres; do
            echo "Waiting for primary to be ready..."; sleep 2;
          done
          if [ -z "$(ls -A /var/lib/postgresql/data)" ]; then
            pg_basebackup -h db-primary -D /var/lib/postgresql/data \
              -U postgres -Fp -Xs -P -R
            echo "Replica initialized from primary via pg_basebackup"
          else
            echo "Data directory already populated, skipping pg_basebackup"
          fi
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: fabflix
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fabflix-secrets
              key: db-password
        command: ["postgres"]
        args: ["-c", "hot_standby=on"]
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "fabflix"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "fabflix"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db-replica
spec:
  selector:
    app: fabflix-db
    role: replica
  ports:
  - port: 5432
    targetPort: 5432
