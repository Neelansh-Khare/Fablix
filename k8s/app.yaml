apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fabflix-app
  template:
    metadata:
      labels:
        app: fabflix-app
    spec:
      containers:
      - name: fabflix-app
        image: fabflix-app:latest
        env:
        - name: DB_URL_WRITE
          value: jdbc:postgresql://db-primary:5432/fabflix
        - name: DB_URL_READ
          value: jdbc:postgresql://db-replica:5432/fabflix
        - name: DB_USERNAME
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fabflix-secrets
              key: db-password
        - name: REDIS_CLUSTER_NODES
          value: "redis-cluster-0.redis-cluster:6379,redis-cluster-1.redis-cluster:6379,redis-cluster-2.redis-cluster:6379,redis-cluster-3.redis-cluster:6379,redis-cluster-4.redis-cluster:6379,redis-cluster-5.redis-cluster:6379"
        - name: TMDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: fabflix-secrets
              key: tmdb-api-key
        - name: RECAPTCHA_SECRET
          valueFrom:
            secretKeyRef:
              name: fabflix-secrets
              key: recaptcha-secret
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: LoadBalancer
  selector:
    app: fabflix-app
  ports:
  - port: 80
    targetPort: 8080
