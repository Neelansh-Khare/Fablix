version: '3.8'

services:
  db-primary:
    image: postgres:15-alpine
    container_name: fabflix-db-primary
    environment:
      POSTGRES_DB: fabflix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica:
    image: postgres:15-alpine
    container_name: fabflix-db-replica
    user: postgres
    environment:
      POSTGRES_DB: fabflix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./scripts/init-replica.sh:/usr/local/bin/init-replica.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init-replica.sh"]
    ports:
      - "5433:5432"
    depends_on:
      db-primary:
        condition: service_healthy
    restart: unless-stopped

  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_started
      redis-node-3:
        condition: service_started
      redis-node-4:
        condition: service_started
      redis-node-5:
        condition: service_started
      redis-node-6:
        condition: service_started
    command: >
      sh -c "echo 'yes' | redis-cli --cluster create 
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 
      redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 
      --cluster-replicas 1"

  app1:
    build: .
    container_name: fabflix-app1
    environment:
      REDIS_CLUSTER_NODES: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
      DB_DRIVER: org.postgresql.Driver
      DB_URL_WRITE: jdbc:postgresql://db-primary:5432/fabflix
      DB_URL_READ: jdbc:postgresql://db-replica:5432/fabflix
      DB_USERNAME: postgres
      DB_PASSWORD: password
      TMDB_API_KEY: ${TMDB_API_KEY}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET}
    depends_on:
      db-primary:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    container_name: fabflix-app2
    environment:
      REDIS_CLUSTER_NODES: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
      DB_DRIVER: org.postgresql.Driver
      DB_URL_WRITE: jdbc:postgresql://db-primary:5432/fabflix
      DB_URL_READ: jdbc:postgresql://db-replica:5432/fabflix
      DB_USERNAME: postgres
      DB_PASSWORD: password
      TMDB_API_KEY: ${TMDB_API_KEY}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET}
    depends_on:
      db-primary:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
    restart: unless-stopped

  lb:
    image: httpd:2.4-alpine
    container_name: fabflix-lb
    ports:
      - "80:80"
    volumes:
      - ./conf/httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  postgres-primary-data:
    driver: local
  redis-data:
    driver: local
